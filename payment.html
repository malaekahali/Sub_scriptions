<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الدفع</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>اختر طريقة الدفع</h1>
    </header>

    <main>
        <section class="payment-options">
            <div class="payment-option">
                <img src="apple-pay.png" alt="Apple Pay">
                <h3>أبل باي</h3>
                <button class="pay-btn">ادفع الآن</button>
            </div>

            <div class="payment-option">
                <img src="visa.png" alt="Credit Card">
                <h3>بطاقة ائتمانية</h3>
                <button class="pay-btn">ادفع الآن</button>
            </div>

            <div class="payment-option">
                <img src="tabby.png" alt="Tabby">
                <h3>تابي</h3>
                <button class="pay-btn">ادفع الآن</button>
            </div>

            <div class="payment-option">
                <img src="tamara.png" alt="Tamara">
                <h3>تمارا</h3>
                <button class="pay-btn">ادفع الآن</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
